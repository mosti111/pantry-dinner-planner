name: pantry

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pantry}
      POSTGRES_USER: ${POSTGRES_USER:-pantry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantry-local-only}
    ports:
      - "5432:5432"
    volumes:
      - pantry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pantry} -d ${POSTGRES_DB:-pantry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pantry}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pantry}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pantry-local-only}
      PANTRY_ALLOWED_ORIGIN: http://localhost:3000
      PANTRY_DEMO_MODE: "true"
      PANTRY_SECURE_COOKIE: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_DEMO_MODE: "true"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pantry-postgres:
